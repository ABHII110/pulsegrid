# Used only for developer commands such as `uv run alembic revision --autogenerate -m "..."`.
# The database URL comes from PULSEGRID_DATABASE_URL (see migrations/env.py); never put it here.
[alembic]
script_location = src/pulsegrid/migrations
file_template = r%%(rev)s_%%(slug)s
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
